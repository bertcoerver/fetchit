# Home Assistant add-on manifest.
#
# Installed from this repository (see repository.yaml at the root), and pulled
# as a ready-made image rather than built on the host: `image:` below is what
# tells Supervisor so. {arch} becomes aarch64 or amd64.
#
# `version` is not edited by hand. The "Release add-on" workflow bumps it, and
# only after both images are pushed — Supervisor offers an update the moment it
# sees a new version here, so bumping it first would offer one it cannot pull.
name: fetchit
version: "0.1.0"
slug: fetchit
image: ghcr.io/bertcoerver/{arch}-fetchit
description: Download feeds into /media, laid out for Jellyfin, rssignal and db-podcast
url: https://github.com/bertcoerver/fetchit

arch:
  - aarch64
  - amd64

# The base image brings its own s6-overlay, so Supervisor must not insert its
# init on top of it.
init: false

startup: application

# The GUI, as a panel in Home Assistant's sidebar: Home Assistant signs you in
# and proxies the page, and no port is published on your network.
ingress: true
ingress_port: 8099
panel_icon: mdi:download-network
panel_title: fetchit

map:
  # -> /config in the container. fetchit.json lives here, so it can be edited
  #    with the File Editor or over Samba without rebuilding the image. So does
  #    youtube-cookies.txt, if YouTube ever asks for one.
  - addon_config:rw
  # -> /media in the container: the folder the Media browser shows, and that
  #    Jellyfin, rssignal and db-podcast read. The library is /media/fetchit.
  - media:rw

options:
  on_start: wait
  schedule:
    - "01:00"
    - "06:00"
    - "14:30"
  keep_days: 30
  update_yt_dlp: true
  log_level: info

schema:
  # What to do the moment the add-on starts, before settling into the schedule.
  # `dry-run` reads every feed and downloads nothing, which is how you check a
  # new fetchit.json; `run` downloads for real. Both exist because there is no
  # shell here to run them from.
  on_start: list(wait|dry-run|run)
  # Local times to run at, HH:MM; empty runs only when asked, from the panel.
  # Put rssignal's and db-podcast's a little after these, so they find what
  # this run downloaded.
  schedule:
    - match(^([01][0-9]|2[0-3]):[0-5][0-9]$)
  # How long a download stays in the library, unless its feed says otherwise
  # with its own "keep_days". 0 keeps everything.
  keep_days: int(0,3650)
  # YouTube extraction breaks often enough that a pinned yt-dlp rots.
  update_yt_dlp: bool
  log_level: list(trace|debug|info|warning|error|fatal)
